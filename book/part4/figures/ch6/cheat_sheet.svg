<svg width="1200" height="1060" xmlns="http://www.w3.org/2000/svg">

<style>
.title { font: 700 30px sans-serif; fill:#111; }
.section { font: 700 18px sans-serif; fill:#111; }
.text { font: 13.5px sans-serif; fill:#222; }
.code { font: 12.5px monospace; fill:#0b5394; }
.box { fill:#ffffff; stroke:#d0d0d0; stroke-width:1.2; rx:10; }
.small { font: 12px sans-serif; fill:#444; }
</style>

<!-- TITLE -->
<text x="50" y="55" class="title">Vector Databases — Cheat Sheet</text>

<!-- ROW 1: WHAT IT DOES & WHY EXACT SEARCH FAILS -->
<rect x="50" y="80" width="540" height="160" class="box"/>
<text x="70" y="110" class="section">What a Vector Database Does</text>
<text x="80" y="140" class="text">Stores high-dimensional vectors and performs nearest-neighbor search (k-NN)</text>
<text x="80" y="165" class="text">Input: query vector → Output: top-k most similar vectors + metadata</text>
<text x="80" y="190" class="text">Also handles persistence, filtering, scaling, CRUD, and access control</text>
<text x="80" y="215" class="text">Core challenge: exact search is too slow at scale → need Approximate NN (ANN)</text>

<rect x="610" y="80" width="540" height="160" class="box"/>
<text x="630" y="110" class="section">Why Exact Search Fails</text>
<text x="640" y="140" class="text">10M vectors × 1,536 dims → ~30B FLOPs per query</text>
<text x="640" y="165" class="text">CPU @ 100 GFLOPS → ~300ms just for dot products (too slow)</text>
<text x="640" y="190" class="text">Solution: ANN (Approximate Nearest Neighbor)</text>
<text x="640" y="215" class="text">Tradeoff: speed vs recall (probabilistic correctness)</text>

<!-- ROW 2: ANN FAMILIES & EXACT SEARCH BASELINE -->
<rect x="50" y="255" width="540" height="155" class="box"/>
<text x="70" y="285" class="section">ANN Families</text>
<text x="80" y="315" class="text">Graph-based | Partition-based | Hashing-based | Tree-based</text>
<text x="80" y="340" class="text">Each reduces search space differently (walk, cluster, hash, or split space)</text>
<text x="80" y="365" class="text">All aim to avoid scanning full dataset</text>

<rect x="610" y="255" width="540" height="155" class="box"/>
<text x="630" y="285" class="section">Exact Search Baseline</text>
<text x="640" y="315" class="code">similarities = X @ q</text>
<text x="640" y="340" class="text">Compute dot product with every vector</text>
<text x="640" y="365" class="text">Complexity: O(n × d)</text>
<text x="640" y="390" class="text">Good only for small corpora (&lt;100K vectors)</text>

<!-- ROW 3: HNSW & CLUSTER METHODS -->
<rect x="50" y="425" width="540" height="255" class="box"/>
<text x="70" y="455" class="section">Graph-Based ANN (HNSW)</text>
<text x="80" y="485" class="text">Most widely used production method</text>
<text x="80" y="510" class="text">Nodes = vectors, edges = nearest neighbors</text>
<text x="80" y="535" class="text">Hierarchical layers: coarse → fine search</text>
<text x="80" y="560" class="text">Search = greedy walk + beam search</text>
<text x="80" y="590" class="code">Key params:</text>
<text x="80" y="615" class="text">M: connectivity (memory vs recall)</text>
<text x="80" y="640" class="text">ef_construction: build quality</text>
<text x="80" y="665" class="text">ef: query-time recall/latency knob</text>

<rect x="610" y="425" width="540" height="255" class="box"/>
<text x="630" y="455" class="section">Cluster-Based (IVF / ScaNN)</text>
<text x="640" y="485" class="text">Partition space into clusters (k-means)</text>
<text x="640" y="510" class="text">Search only nearest clusters (nprobe)</text>
<text x="640" y="535" class="text">Good for very large scale (100M–1B+ vectors)</text>
<text x="640" y="565" class="code">IVF-PQ:</text>
<text x="640" y="590" class="text">Cluster + compressed vectors</text>
<text x="640" y="615" class="text">Huge memory savings, slight recall loss</text>

<!-- ROW 4: HASH & TREE & METHOD COMPARISON -->
<rect x="50" y="695" width="540" height="160" class="box"/>
<text x="70" y="725" class="section">Hashing &amp; Tree Methods</text>
<text x="80" y="755" class="text">LSH: hash similar vectors to same bucket</text>
<text x="80" y="780" class="text">Annoy: random projection trees</text>
<text x="80" y="805" class="text">Mostly legacy / niche use cases today</text>
<text x="80" y="835" class="text">Best for: dedup, static catalogs, simple systems</text>

<rect x="610" y="695" width="540" height="160" class="box"/>
<text x="630" y="725" class="section">Method Comparison</text>
<text x="640" y="755" class="text">Graph (HNSW): best recall/latency, in-memory, dynamic updates</text>
<text x="640" y="780" class="text">Partition (IVF/PQ): best at billion scale + compression</text>
<text x="640" y="805" class="text">Hashing (LSH): theoretical guarantees, weaker in practice</text>
<text x="640" y="830" class="text">Tree (Annoy): static, memory-mapped, simple deployments</text>

<!-- ROW 5: LANDSCAPE & FILTERING -->
<rect x="50" y="870" width="540" height="175" class="box"/>
<text x="70" y="900" class="section">Vector Database Landscape</text>
<text x="80" y="930" class="text">Pinecone: fully managed, easy scaling, expensive at scale</text>
<text x="80" y="955" class="text">Weaviate: hybrid search (BM25 + vector), modular stack</text>
<text x="80" y="980" class="text">Qdrant: fast filtered search, Rust-based performance</text>
<text x="80" y="1005" class="text">Milvus: billion-scale systems, heavy infra</text>
<text x="80" y="1030" class="text">pgvector: Postgres-native vector search</text>

<rect x="610" y="870" width="540" height="175" class="box"/>
<text x="630" y="900" class="section">Metadata Filtering</text>
<text x="640" y="930" class="text">Goal: restrict retrieval by metadata (source, date, access level)</text>
<text x="640" y="955" class="text">Pre-filter: reduce dataset before search (faster if selective)</text>
<text x="640" y="980" class="text">Post-filter: search first, then filter (may lose results)</text>
<text x="640" y="1005" class="text">Hybrid: best practice (filter-aware ANN search)</text>


</svg>

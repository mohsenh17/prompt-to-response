<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="2200"
     viewBox="0 0 1600 2260">

  <style>
    .section { font: 700 18px sans-serif; fill:#111; }
    .text { font: 14px sans-serif; fill:#222; }
    .code { font: 13px monospace; fill:#222; }
    .box { fill:#ffffff; stroke:#cccccc; stroke-width:1.2; rx:10; }
  </style>

  <!-- ========================================================= -->
  <!-- TITLE -->
  <!-- ========================================================= -->


  <!-- ========================================================= -->
  <!-- 1. COMPETENCE VS ALIGNMENT -->
  <!-- ========================================================= -->
  <g transform="translate(0,-105)">
  <rect x="70" y="145" width="1460" height="230" class="box"/>

  <text x="100" y="180" class="section">
    1. The Gap Between Competence and Alignment
  </text>

  <rect x="100" y="205" width="420" height="130" class="box"/>
  <text x="125" y="235" class="section">Pretraining</text>
  <text x="125" y="265" class="text">Learns next-token prediction</text>
  <text x="125" y="290" class="text">Produces fluent, knowledgeable, coherent text</text>
  <text x="125" y="315" class="text">But does not reliably optimize for human goals</text>

  <rect x="585" y="205" width="420" height="130" class="box"/>
  <text x="610" y="235" class="section">Instruction Fine-Tuning</text>
  <text x="610" y="265" class="text">Solves the format problem</text>
  <text x="610" y="290" class="text">Learns to respond to instructions</text>
  <text x="610" y="315" class="text">Does not fully encode human values</text>

  <rect x="1070" y="205" width="420" height="130" class="box"/>
  <text x="1095" y="235" class="section">Alignment</text>
  <text x="1095" y="265" class="text">Solves the value problem</text>
  <text x="1095" y="290" class="text">Helpful • Honest • Harmless</text>
  <text x="1095" y="315" class="text">Learns preferences over whole responses</text>

  <!-- ========================================================= -->
  <!-- 2. REWARD MODEL -->
  <!-- ========================================================= -->

  <rect x="70" y="405" width="1460" height="310" class="box"/>

  <text x="100" y="440" class="section">
    2. Reward Model: Learning Human Preferences
  </text>

  <rect x="100" y="470" width="330" height="200" class="box"/>
  <text x="125" y="505" class="section">Preference Data</text>
  <text x="125" y="540" class="text">Prompt x</text>
  <text x="125" y="570" class="text">Winner y_w</text>
  <text x="125" y="600" class="text">Loser y_l</text>
  <text x="125" y="635" class="text">Human chooses which is better</text>

  <rect x="470" y="470" width="330" height="200" class="box"/>
  <text x="495" y="505" class="section">Shared Reward Model</text>
  <text x="495" y="545" class="code">r_w = rφ(x, y_w)</text>
  <text x="495" y="580" class="code">r_l = rφ(x, y_l)</text>
  <text x="495" y="620" class="text">Same parameters</text>
  <text x="495" y="645" class="text">Two forward passes</text>

  <rect x="840" y="470" width="650" height="200" class="box"/>
  <text x="865" y="505" class="section">Bradley–Terry Loss</text>
  <text x="865" y="550" class="code">L_RM = - log σ(r_w - r_l)</text>
  <text x="865" y="590" class="text">Goal: preferred completion receives higher reward</text>
  <text x="865" y="620" class="text">Only relative ordering is supervised</text>
  <text x="865" y="650" class="text">No absolute meaning such as "8 / 10"</text>

  <!-- ========================================================= -->
  <!-- 3. RLHF PPO COMPONENTS -->
  <!-- ========================================================= -->

  <rect x="70" y="745" width="1460" height="350" class="box"/>

  <text x="100" y="780" class="section">
    3. RLHF with PPO: Four Models
  </text>

  <rect x="100" y="815" width="320" height="230" class="box"/>
  <text x="125" y="850" class="section">Actor / Policy πθ</text>
  <text x="125" y="890" class="text">Generates tokens</text>
  <text x="125" y="920" class="text">Receives gradient updates</text>
  <text x="125" y="950" class="text">Uses advantages to improve actions</text>
  <text x="125" y="990" class="text">Optimized by PPO</text>

  <rect x="455" y="815" width="320" height="230" class="box"/>
  <text x="480" y="850" class="section">Reward Model rφ</text>
  <text x="480" y="890" class="text">Scores complete responses</text>
  <text x="480" y="920" class="text">Produces scalar reward</text>
  <text x="480" y="950" class="text">Frozen during PPO</text>
  <text x="480" y="990" class="text">Proxy for human judgment</text>

  <rect x="810" y="815" width="320" height="230" class="box"/>
  <text x="835" y="850" class="section">Critic / Value Vφ</text>
  <text x="835" y="890" class="text">Evaluates partial sequences</text>
  <text x="835" y="920" class="text">Predicts expected future return</text>
  <text x="835" y="950" class="text">Provides baseline for advantage</text>
  <text x="835" y="990" class="text">Trained during PPO</text>

  <rect x="1165" y="815" width="325" height="230" class="box"/>
  <text x="1190" y="850" class="section">Reference π_ref</text>
  <text x="1190" y="890" class="text">Frozen SFT model</text>
  <text x="1190" y="920" class="text">Defines trusted behavior</text>
  <text x="1190" y="950" class="text">Provides KL constraint</text>
  <text x="1190" y="990" class="text">Prevents excessive drift</text>

  <!-- ========================================================= -->
  <!-- 4. PPO OBJECTIVE -->
  <!-- ========================================================= -->

  <rect x="70" y="1125" width="710" height="260" class="box"/>

  <text x="100" y="1160" class="section">
    PPO Policy Update
  </text>

  <text x="100" y="1210" class="code">
    ρ_t = πθ(a_t|s_t) / πold(a_t|s_t)
  </text>

  <text x="100" y="1255" class="code">
    Lπ = - min(ρ_t Â_t,
  </text>

  <text x="100" y="1285" class="code">
    clip(ρ_t, 1-ε, 1+ε) Â_t)
  </text>

  <text x="100" y="1330" class="text">
    Clipping limits how much the policy can change per update.
  </text>

  <rect x="820" y="1125" width="710" height="260" class="box"/>

  <text x="850" y="1160" class="section">
    RLHF Objective
  </text>

  <text x="850" y="1210" class="code">
    max E[rφ(x,y)
  </text>

  <text x="850" y="1240" class="code">
    - β log(πθ(y|x) / πref(y|x))]
  </text>

  <text x="850" y="1290" class="text">
    Reward term: improve according to reward model
  </text>

  <text x="850" y="1320" class="text">
    KL term: stay close to trusted SFT behavior
  </text>

  <text x="850" y="1350" class="text">
    High β → conservative • Low β → aggressive
  </text>

  <!-- ========================================================= -->
  <!-- 5. CRITIC / ADVANTAGE -->
  <!-- ========================================================= -->

  <rect x="70" y="1415" width="1460" height="350" class="box"/>

  <text x="100" y="1450" class="section">
    4. Critic Training and Advantage Estimation
  </text>

  <rect x="100" y="1485" width="410" height="230" class="box"/>
  <text x="125" y="1520" class="section">Monte Carlo</text>
  <text x="125" y="1560" class="code">G_t = Σ γ^(k-t) r_k</text>
  <text x="125" y="1605" class="text">Uses actual final outcome</text>
  <text x="125" y="1635" class="text">Low bias</text>
  <text x="125" y="1665" class="text">High variance</text>
  <text x="125" y="1695" class="text">Information available everywhere</text>

  <rect x="555" y="1485" width="410" height="230" class="box"/>
  <text x="580" y="1520" class="section">Bootstrapping</text>
  <text x="580" y="1560" class="code">y_t = r_t + γV(s_t+1)</text>
  <text x="580" y="1605" class="text">Uses critic's next-state prediction</text>
  <text x="580" y="1635" class="text">Lower variance</text>
  <text x="580" y="1665" class="text">Introduces bias</text>
  <text x="580" y="1695" class="text">Reward propagates backward gradually</text>

  <rect x="1010" y="1485" width="480" height="230" class="box"/>
  <text x="1035" y="1520" class="section">GAE</text>
  <text x="1035" y="1560" class="code">δ_t = r_t + γV(s_t+1) - V(s_t)</text>
  <text x="1035" y="1600" class="code">A_t = Σ(γλ)^k δ_t+k</text>
  <text x="1035" y="1640" class="text">λ = 0 → one-step bootstrapping</text>
  <text x="1035" y="1670" class="text">λ = 1 → Monte Carlo-like return</text>
  <text x="1035" y="1700" class="text">Practical bias–variance compromise</text>

  <!-- ========================================================= -->
  <!-- 6. PPO LOOP -->
  <!-- ========================================================= -->

  <rect x="70" y="1795" width="1460" height="270" class="box"/>

  <text x="100" y="1830" class="section">
    5. PPO Training Loop
  </text>

  <rect x="100" y="1870" width="210" height="145" class="box"/>
  <text x="125" y="1905" class="section">1. Rollout</text>
  <text x="125" y="1940" class="text">Sample prompts</text>
  <text x="125" y="1970" class="text">Generate responses</text>
  <text x="125" y="2000" class="text">Current policy</text>

  <rect x="335" y="1870" width="210" height="145" class="box"/>
  <text x="360" y="1905" class="section">2. Score</text>
  <text x="360" y="1940" class="text">Reward model</text>
  <text x="360" y="1970" class="text">Terminal reward</text>
  <text x="360" y="2000" class="text">KL penalty</text>

  <rect x="570" y="1870" width="210" height="145" class="box"/>
  <text x="595" y="1905" class="section">3. GAE</text>
  <text x="595" y="1940" class="text">Value prediction</text>
  <text x="595" y="1970" class="text">TD residuals</text>
  <text x="595" y="2000" class="text">Advantages + targets</text>

  <rect x="805" y="1870" width="210" height="145" class="box"/>
  <text x="830" y="1905" class="section">4. Optimize</text>
  <text x="830" y="1940" class="text">Actor loss</text>
  <text x="830" y="1970" class="text">Critic loss</text>
  <text x="830" y="2000" class="text">Entropy bonus</text>

  <rect x="1040" y="1870" width="210" height="145" class="box"/>
  <text x="1065" y="1905" class="section">5. Stop</text>
  <text x="1065" y="1940" class="text">Monitor KL</text>
  <text x="1065" y="1970" class="text">Early stopping</text>
  <text x="1065" y="2000" class="text">Prevent policy drift</text>

  <rect x="1275" y="1870" width="215" height="145" class="box"/>
  <text x="1300" y="1905" class="section">6. Refresh</text>
  <text x="1300" y="1940" class="text">Discard rollout</text>
  <text x="1300" y="1970" class="text">Update old policy</text>
  <text x="1300" y="2000" class="text">Generate fresh data</text>

  <!-- ========================================================= -->
  <!-- 7. DPO -->
  <!-- ========================================================= -->

  <rect x="70" y="2095" width="710" height="250" class="box"/>

  <text x="100" y="2130" class="section">
    6. DPO: Direct Preference Optimization
  </text>

  <text x="100" y="2175" class="code">
    Δ = β log[πθ(yw|x) / πref(yw|x)]
  </text>

  <text x="100" y="2205" class="code">
    - β log[πθ(yl|x) / πref(yl|x)]
  </text>

  <text x="100" y="2250" class="code">
    L_DPO = - log σ(Δ)
  </text>

  <text x="100" y="2290" class="text">
    Preferred: increase relative probability
  </text>

  <text x="100" y="2320" class="text">
    Rejected: decrease relative probability
  </text>

  <rect x="820" y="2095" width="710" height="250" class="box"/>

  <text x="850" y="2130" class="section">
    PPO vs DPO
  </text>

  <text x="850" y="2175" class="text">
    PPO: on-policy • RL • reward model • critic • 4 models
  </text>

  <text x="850" y="2215" class="text">
    DPO: off-policy • preference loss • no reward model
  </text>

  <text x="850" y="2255" class="text">
    PPO: fresh rollouts adapt to current policy
  </text>

  <text x="850" y="2295" class="text">
    DPO: simpler, stable, fixed preference dataset
  </text>

  <text x="850" y="2335" class="text">
    Both optimize toward human preference signals
  </text>
  </g>
</svg>
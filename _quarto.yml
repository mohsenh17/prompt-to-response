project:
  type: book    
  output-dir: build  
  resources:
    - images/

book:
  title: "From Prompt to Response"
  subtitle: "An End-to-End Journey Inside LLM and RAG Systems"
  site-url: "https://llm.hosseini.work"
  repo-url: "https://github.com/mohsenh17/prompt-to-response"
  sidebar:
    collapse-level: 1

  favicon: images/favicon.png
  open-graph: true
  twitter-card: true
  image: images/metadata.png
  

  chapters:
    - index.md
    - part: "The Art of the True Name"
      chapters: 
        - book/part1/chapter1/introduction.md

    - part: "The Runes Beneath Language"
      chapters:
        - book/part2/APIs_and_serving.md
        - book/part2/Tokenization.md
        - book/part2/Embeddings_and_meaning.md

    - part: "The Labyrinth of Attention"
      chapters: 
        - book/part3/transformer-architecture.md
        - book/part3/attention-computation.md
        - book/part3/kv-cache.md
        - book/part3/gpu-execution.md
        - book/part3/quantization.md
        - book/part3/decoding-and-sampling.md

    - part: "The Forbidden Archive"
      chapters: 
        - book/part4/parametric-vs-external-memory.md
        - book/part4/document_ingestion.md
        - book/part4/chunking_strategies.md
        - book/part4/embedding_for_search.md
        - book/part4/vector_databases.md
        - book/part4/retrieval_algorithms.md
        - book/part4/reranking.md
        - book/part4/context_construction.md
        - book/part4/grounded_generation.md

    - part: "The Forging of Intelligence"
      chapters: 
        - book/part5/data_collection.md
        - book/part5/synthetic_data.md
        - book/part5/training_tokenization.md
        - book/part5/training_objectives.md
        - book/part5/training_loop.md
        - book/part5/distributed_training.md
        - book/part5/distillation.md
        - book/part5/fine_tuning.md
        - book/part5/alignment.md
        - book/part5/reasoning.md
        - book/part5/embedding.md

    - part: "The Trial of the Answer"
      chapters: 
        - book/part6/human_eval.md
        - book/part6/benchmarks.md

    - part: "The Keepers of the Waking Engine"
      chapters: []    
# --------------------------------------------------
# Output formats
# --------------------------------------------------
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 2
    number-sections: true
    code-copy: true
    smooth-scroll: true
    page-navigation: true

  pdf:
    documentclass: book
    toc: true
    toc-depth: 2
    number-sections: true
    geometry:
      - top=1in
      - bottom=1in
      - left=0.7in
      - right=0.7in
    fontsize: 10pt
    linestretch: 1
    page-navigation: false

  epub: default

# --------------------------------------------------
# Cross references & numbering
# --------------------------------------------------
crossref:
  chapters: true

# --------------------------------------------------
# Execution options
# --------------------------------------------------
execute:
  freeze: auto
  echo: true
  warning: false
  message: false


bibliography: references.bib
csl: https://www.zotero.org/styles/ieee